name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  core-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Checkout design-dna source
        uses: actions/checkout@v4.2.2
        with:
          repository: einmalmaik/maunting-design-dna
          ref: 'main'
          token: ${{ secrets.SINGRA_PREMIUM_PAT }}
          path: .design-dna-source
          persist-credentials: false

      - name: Stage design-dna source as sibling repository
        run: |
          node -e "const fs = require('fs'); fs.mkdirSync('../maunting-design-dna', { recursive: true })"
          node scripts/stage-premium-source.mjs .design-dna-source ../maunting-design-dna/maunting-design-dna

      - name: Install design-dna dependencies
        run: npm ci --prefix ../maunting-design-dna/maunting-design-dna

      - name: Install dependencies
        run: npm ci

      - name: Repository secret guardrails
        run: npm run security:repo-guard

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build core bundle
        run: npm run build:core-only

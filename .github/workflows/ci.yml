name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  core-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository secret guardrails
        run: npm run security:repo-guard

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Test SMTP adapter
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run SMTP adapter tests
        run: npm run test:smtp

      - name: Lint
        run: npm run lint

      - name: Build core bundle
        run: npm run build:core-only

      - name: Release artifact guardrails
        run: npm run release:check-artifacts

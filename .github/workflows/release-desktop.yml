name: release-desktop

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    env:
      VITE_SITE_URL: ${{ vars.OFFICIAL_VITE_SITE_URL }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.OFFICIAL_VITE_SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.OFFICIAL_VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ vars.OFFICIAL_VITE_SUPABASE_URL }}
      VITE_OPAQUE_SERVER_STATIC_PUBLIC_KEY: ${{ secrets.VITE_OPAQUE_SERVER_STATIC_PUBLIC_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Checkout premium source
        uses: actions/checkout@v4.2.2
        with:
          repository: einmalmaik/singra-premium
          ref: ${{ vars.SINGRA_PREMIUM_REF || 'master' }}
          token: ${{ secrets.SINGRA_PREMIUM_PAT }}
          path: .premium-source
          persist-credentials: false

      - name: Stage premium source as sibling repository
        run: node scripts/stage-premium-source.mjs .premium-source ../singra-premium

      - name: Checkout design-dna source
        uses: actions/checkout@v4.2.2
        with:
          repository: einmalmaik/maunting-design-dna
          ref: 'main'
          token: ${{ secrets.SINGRA_PREMIUM_PAT }}
          path: .design-dna-source
          persist-credentials: false

      - name: Stage design-dna source as sibling repository
        run: |
          node -e "const fs = require('fs'); fs.mkdirSync('../maunting-design-dna', { recursive: true })"
          node scripts/stage-premium-source.mjs .design-dna-source ../maunting-design-dna/maunting-design-dna

      - name: Install design-dna dependencies
        working-directory: ../maunting-design-dna/maunting-design-dna
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install core dependencies
        run: npm ci

      - name: Repository secret guardrails
        run: npm run security:repo-guard

      - name: Release artifact guardrails
        run: npm run release:check-artifacts

      - name: Validate official desktop configuration
        run: node scripts/validate-official-desktop-config.mjs

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SINGRA_PREMIUM_SOURCE: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Singra Vault v__VERSION__"
          releaseBody: |
            ## Singra Vault v0.6.4

            - **Core Feature Integration**: Shifted crucial security features directly into the Core package (including Duress/Panic password protection, Emergency Access configurations, File Attachment support, and Vault Health diagnostics).
            - **Seamless Session Persistence**: Added a robust Windows DPAPI-backed secure persistence layer in the Rust backend to ensure users stay logged in online after restarting the application.
            - **MauntingStudios Design DNA**: Integrated the premium `.scrollbar-ice` smooth scrollbar styling across all core panels (Sidebar, Entry Dialogs, Previews, and Dropdowns).
            - **Enhanced Offline Reliability**: Bypassed redundant remote database queries when starting in offline mode, eliminating console warnings and improving start times.
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
